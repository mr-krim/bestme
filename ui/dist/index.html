<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BestMe - Modern Speech-to-Text Application with AI chat capabilities" />
    <meta name="theme-color" content="#2196f3" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192x192.png" />
    
    <!-- Preload system fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"></noscript>
    
    <!-- Base styles to prevent FOUC -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f9f9f9;
        color: #333;
        height: 100vh;
        overflow: hidden;
      }
      
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121212;
          color: #eee;
        }
      }
      
      #app {
        height: 100vh;
        display: flex;
      }
      
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100%;
      }
      
      .app-loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #2196f3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    
    <title>BestMe - Modern Speech-to-Text</title>
    <script type="module" crossorigin src="./assets/index-DiWWYiKi.js"></script>

  </head>

    <div id="app">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div>Loading BestMe...</div>
      </div>
    </div>
    <script type="module" crossorigin src="./assets/index-DiWWYiKi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Tdhv8wFT.css">
