# This project has been migrated to Tauri 2.0
# See docs/migration-summary.md for details on the migration process

[package]
name = "bestme"
version = "0.1.0"
edition = "2021"
description = "Modern speech-to-text application powered by AI"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tauri-2", "config", "audio", "transcribe", "storage", "commands", "text-injection", "ai-all", "whisper"]
whisper = ["dep:whisper-rs"] # Enable Whisper speech recognition
tauri-2 = ["dep:tauri", "dep:tauri-build"]
config = []
audio = []
transcribe = ["whisper"]
commands = []
storage = ["dep:rusqlite", "dep:uuid"]
text-injection = ["dep:async-trait"]
ai-local = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:ort", "dep:tokenizers", "dep:ndarray", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-stdout", "dep:dashmap", "dep:once_cell"]
ai-cloud = []
ai-all = ["ai-local", "ai-cloud"]

# GPU acceleration features
gpu-cuda = ["whisper-rs/cuda", "dep:cudarc", "dep:nvml-wrapper"]
gpu-metal = ["whisper-rs/metal"]
# gpu-vulkan = ["whisper-rs/vulkan"] # Vulkan not available in whisper-rs
# gpu-hipblas = ["whisper-rs/hipblas"] # Not available in current whisper-rs version
gpu-all = ["gpu-cuda", "gpu-metal"]

[dependencies]
# Utility
log = "0.4.22" # Logging facility
env_logger = "0.11.5" # Environment-based logger
anyhow = "1.0.94"
thiserror = "2.0.9" # Error definition
rand = "0.8.5" # Random number generation
parking_lot = "0.12.3" # Better Mutex implementation
chrono = { version = "0.4.39", features = ["serde"] } # Date and time handling
regex = "1.11.1"
csv = "1.3" # CSV file handling for vocabulary import/export
clap = { version = "4.5", features = ["derive", "cargo"] } # CLI argument parsing
num_cpus = "1.16" # CPU core detection

# Configuration and serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
toml = "0.8.19" # TOML parser for settings.cfg
directories = "5.0.1" # Find platform-specific directories

# Audio processing
cpal = "0.15.3" # Cross-platform audio library
ringbuf = "0.4.7" # Lock-free ring buffer for audio processing
hound = "3.5.1" # WAV file manipulation 
spectrum-analyzer = "1.5.0" # Audio visualization

# Async runtime
tokio = { version = "1.42.0", features = ["full"] } # Async runtime

# For SVG icons and visualization
tiny-skia = { version = "0.11.4", features = ["std"] }
usvg = { version = "0.44.0", default-features = false }

# Speech recognition
whisper-rs = { version = "0.11.1", optional = true }
reqwest = { version = "0.12.22", features = ["json", "stream"] }
tokio-util = { version = "0.7.13", features = ["codec"] }

# Testing dependencies
tempfile = "3.15.0"

# Async utilities
futures = "0.3.31"

# AI dependencies
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
ort = { version = "1.16", optional = true, features = ["download-binaries"] }
tokenizers = { version = "0.21", optional = true }
ndarray = { version = "0.15", optional = true }

# Telemetry dependencies
opentelemetry = { version = "0.24", features = ["metrics", "trace"], optional = true }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.17", optional = true }
opentelemetry-stdout = { version = "0.5", features = ["metrics", "trace"], optional = true }

# Additional AI dependencies
dashmap = { version = "6.1", optional = true }
once_cell = { version = "1.20", optional = true }
lru = "0.12"
semver = "1.0"
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Storage dependencies
rusqlite = { version = "0.32.1", features = ["bundled", "serde_json", "chrono"], optional = true }
uuid = { version = "1.11.0", features = ["v4", "serde"], optional = true }

# Text injection dependencies
async-trait = { version = "0.1.83", optional = true }

# GPU acceleration dependencies
cudarc = { version = "0.10", optional = true }
nvml-wrapper = { version = "0.9", optional = true }
opencl3 = { version = "0.9", optional = true }
# hip-runtime-sys = { version = "0.1", optional = true } # Commented out - use whisper-rs hipblas feature instead

# Tauri 2.0 dependencies
tauri = { version = "2.1.1", optional = true }

# Tauri plugins
tauri-plugin-clipboard-manager = "2.2.0"
tauri-plugin-dialog = "2.1.0"
tauri-plugin-fs = "2.1.0"
tauri-plugin-notification = "2.1.0"
tauri-plugin-os = "2.1.0"
tauri-plugin-process = "2.1.0"
tauri-plugin-shell = "2.1.0"

# GUI and Windows integration
[dependencies.windows]
version = "0.61"
features = [
    "Win32",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Authentication_Identity",
]

# For Phase 4 and later
# GUI Framework is commented out for now

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_DataExchange",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_Security_Authentication_Identity",
] }
clipboard-win = "5.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24.0"
cocoa = "0.26.0"
objc = "0.2.7"
security-framework = "3.0"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21.0", features = ["xtest"] }
secret-service = { version = "4.0", features = ["rt-tokio-crypto-rust"] }

[profile.dev]
opt-level = 1 # Better optimization for development

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2.0.3", optional = true }

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[workspace]
members = ["src-tauri"]

# [patch.crates-io]
# zbus = { version = "4", default-features = false, features = ["tokio"] }

[package.metadata.tauri]
name = "BestMe"
appName = "BestMe"
version = "0.1.0"
identifier = "com.bestme.app"
shortDescription = "Speech-to-text application"
windowsName = "BestMe"
windowsTitle = "BestMe - Speech to Text"
appImage = "assets/icons/icon.png"
trayIcon = "assets/icons/tray.png"
windowIcon = "assets/icons/icon.png"
hiddenWindowsAtLaunch = false
