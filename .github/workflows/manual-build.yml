name: Manual Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
          - macos
          - all

jobs:
  build-windows:
    if: ${{ github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install frontend dependencies
        run: |
          cd ui
          npm install
          
      - name: Build Tauri app
        run: |
          cargo tauri build
          
      - name: Create portable package
        run: |
          mkdir -p dist/windows-portable
          cp src-tauri/target/release/bestme-tauri.exe dist/windows-portable/BestMe.exe
          cp -r config dist/windows-portable/
          
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestMe-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            dist/windows-portable/
            
  build-linux:
    if: ${{ github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxdo-dev \
            libxtst-dev
            
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install frontend dependencies
        run: |
          cd ui
          npm install
          
      - name: Build Tauri app
        run: |
          cargo tauri build
          
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestMe-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            
  build-macos:
    if: ${{ github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install frontend dependencies
        run: |
          cd ui
          npm install
          
      - name: Build Tauri app
        run: |
          cargo tauri build
          
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BestMe-macOS
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app